name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  phpunit:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} (${{ matrix.stability }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11', '12', '13']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '11'
            testbench: '^9.0'
          - laravel: '12'
            testbench: '^10.0'
          - laravel: '13'
            testbench: '^11.0'
        exclude:
          - laravel: '13'
            php: '8.2'
          - laravel: '11'
            php: '8.5'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          extensions: sodium, pdo_sqlite
          coverage: none
      - name: Allow Laravel 11 (end of life, every release has open advisories)
        if: matrix.laravel == '11'
        run: composer config policy.advisories.block false
      - name: Install dependencies
        run: |
          composer require "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit

  without-sodium:
    name: sodium_compat polyfill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          extensions: :sodium
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress --ignore-platform-req=ext-sodium
      - run: vendor/bin/phpunit

  databases:
    name: Database ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mysql
            image: mysql:8.4
            port: 3306
          - db: mariadb
            image: mariadb:11
            port: 3306
          - db: pgsql
            image: postgres:17
            port: 5432
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: testing
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports:
          - 5432:5432
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.db == 'pgsql' && 'pg_isready' || 'mysqladmin ping -ppassword || healthcheck.sh --connect' }}"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      SP_TEST_DB: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: testing
      DB_USERNAME: ${{ matrix.db == 'pgsql' && 'postgres' || 'root' }}
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          extensions: sodium, pdo_mysql, pdo_pgsql
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpunit

  e2e:
    name: Interoperability with the reference service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout the specification and reference client
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SP_REFERENCE_REPOSITORY || 'ctrlwebinc/site-portrait-protocol' }}
          ref: ${{ vars.SP_REFERENCE_REF || 'v1.1.0' }}
          path: site-portrait-protocol
          token: ${{ secrets.SP_REFERENCE_TOKEN || github.token }}
      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          extensions: sodium, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: site-portrait-protocol
      - run: composer update --prefer-dist --no-interaction --no-progress
      - name: Check that the bundled schemas and vectors match the specification
        run: |
          diff -u site-portrait-protocol/schema/portrait-v1.schema.json resources/schema/portrait-v1.schema.json
          diff -u site-portrait-protocol/schema/discovery-v1.schema.json resources/schema/discovery-v1.schema.json
          diff -u site-portrait-protocol/test-vectors.json tests/fixtures/test-vectors.json
      - run: node --test tests/e2e/interop.test.mjs
        env:
          SP_REFERENCE_DIR: site-portrait-protocol
          SP_E2E_LOGS: '1'
